  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0d0d0d;
      color: #fff;
      padding: 20px;
      margin: 0;
      line-height: 1.6;
    }

    h1 {
      color: #ffd700;
      text-align: center;
      font-size: 2rem;
      margin: 0;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    #back-arrow {
      background: rgba(255, 215, 0, 0.1);
      border: 2px solid #ffd700;
      color: #ffd700;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
    }
    #back-arrow:hover {
      background: rgba(255, 215, 0, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    #videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-box {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
      transition: transform 0.3s ease-in-out, box-shadow 0.3s;
      overflow: hidden;
      text-align: center;
      position: relative;
    }

    .video-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .video-title {
      font-size: 18px;
      color: #ffd700;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .thumb-wrapper {
      position: relative;
    }

    .video-thumb {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .thumb-wrapper:hover .overlay {
      opacity: 1;
    }

    .overlay i {
      font-size: 50px;
      color: #ffd700;
    }

    .video-meta {
      font-size: 14px;
      color: #bbb;
      margin-top: 8px;
    }

    .loading {
      text-align: center;
      font-size: 18px;
      color: #ffd700;
      padding: 20px;
    }

    @media (max-width: 768px) {
      #videos-container {
        grid-template-columns: 1fr;
      }
      .video-title {
        font-size: 16px;
      }
      .video-thumb {
        height: 160px;
      }
    }
  </style>
</head>

    backBtn.onclick = () => {
      if (lecture) {
        window.location.href = `lecture_name.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
      } else {
        window.location.href = `chapters.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}`;
      }
    };

    function normalize(str) {
      return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
    }

    async function loadVideos() {
      if (!subject || !teacher || !chapter) {
        videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لم يتم تحديد المادة أو المدرس أو الباب.</div>";
        return;
      }

      try {
        const res = await fetch("coursatk_scraped_data.json");
        const json = await res.json();
        const data = json.data || json;

        const wantedSubject = normalize(subject);
        const wantedTeacher = normalize(teacher);
        const wantedChapter = normalize(chapter);
        const wantedLecture = normalize(lecture);
        const videos = [];

        (data || []).forEach((year) => {
          (year.subjects || []).forEach((sub) => {
            if (normalize(sub.subject_name).includes(wantedSubject)) {
              (sub.teachers || []).forEach((t) => {
                if (normalize(t.teacher_name).includes(wantedTeacher)) {
                  (t.chapters || []).forEach((chap) => {
                    if (normalize(chap.chapter_name).includes(wantedChapter)) {
                      (chap.lectures || []).forEach((lec) => {
                        if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                          (lec.videos || []).forEach((vid) => {
                            if (vid.links && vid.links.length > 0) {
                              const qualities = vid.links.map(q => ({
                                label: q.label,
                                url: q.url
                              }));
                              videos.push({
                                name: vid.video_name,
                                qualities
                              });
                            }
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        });

        videosContainer.innerHTML = "";

        if (videos.length === 0) {
          videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
          return;
        }

        const thumb = teacherThumbs[teacher] || "https://img.icons8.com/fluency/300/youtube-play.png";

        videos.forEach((video) => {
          const box = document.createElement("div");
          box.className = "video-box";
          box.innerHTML = `
            <div class="video-title">${video.name}</div>
            <div class="thumb-wrapper">
              <img class="video-thumb" src="${thumb}" alt="video">
              <div class="overlay"><i class="fas fa-play-circle"></i></div>
            </div>
            <div class="video-meta">${teacher} • ${chapter}</div>
          `;
          box.onclick = () => {
            const sources = encodeURIComponent(JSON.stringify(video.qualities));
            window.location.href = `player.html?sources=${sources}&title=${encodeURIComponent(video.name)}`;
          };
          videosContainer.appendChild(box);
        });
      } catch (err) {
        console.error("❌ خطأ أثناء تحميل البيانات:", err);
        videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
      }
    }

    loadVideos();
  </script>
