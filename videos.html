<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الفيديوهات - منصة THE BEST</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #ffd700;
    --gold-light: #ffea8a;
    --bg-dark: #0a0a0a;
    --card-bg: linear-gradient(145deg, #181818, #0e0e0e);
    --shadow: 0 0 20px rgba(255, 215, 0, 0.25);
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: radial-gradient(circle at top, #000, #0a0a0a);
    color: #fff;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    background: rgba(15, 15, 15, 0.95);
    padding: 25px 15px;
    text-align: center;
    border-bottom: 1px solid rgba(255, 215, 0, 0.15);
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
  }

  header h1 {
    color: var(--gold);
    margin: 0;
    font-size: 2.4rem;
    font-weight: 900;
    text-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
    letter-spacing: 1.2px;
  }

  #back {
    display: inline-block;
    margin-top: 10px;
    color: var(--gold);
    font-weight: 600;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    user-select: none;
  }

  #back:hover {
    color: #fff;
    transform: translateX(-6px);
  }

  main {
    padding: 50px 20px 80px;
    max-width: 1300px;
    margin: auto;
  }

  #videos-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 30px;
    justify-items: center;
  }

  .video-box {
    background: var(--card-bg);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 20px;
    padding: 40px 20px;
    width: 100%;
    max-width: 380px;
    text-align: center;
    cursor: pointer;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .video-box::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,215,0,0.15), transparent 70%);
    transform: scale(0);
    transition: transform 0.6s ease;
    z-index: 0;
  }

  .video-box:hover::before {
    transform: scale(1);
  }

  .video-icon {
    font-size: 40px;
    color: var(--gold);
    margin-bottom: 15px;
    filter: drop-shadow(0 0 8px rgba(255,215,0,0.4));
    transition: 0.3s;
  }

  .video-box:hover .video-icon {
    color: var(--gold-light);
    transform: scale(1.2);
  }

  .video-title {
    position: relative;
    z-index: 2;
    color: var(--gold);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.3px;
    line-height: 1.6;
    text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
  }

  .video-box:hover {
    transform: translateY(-10px);
    box-shadow: var(--shadow);
  }

  footer {
    text-align: center;
    color: #999;
    font-size: 0.95rem;
    padding: 25px 10px 20px;
    border-top: 1px solid rgba(255, 215, 0, 0.1);
    background: #0a0a0a;
  }

  footer span {
    color: var(--gold);
    font-weight: bold;
  }

  @media (max-width: 600px) {
    header h1 {
      font-size: 1.8rem;
    }
    .video-title {
      font-size: 18px;
    }
    .video-icon {
      font-size: 34px;
    }
  }

  /* تأثير ذهبي خفيف متحرك */
  @keyframes gold-glow {
    0% { text-shadow: 0 0 10px rgba(255,215,0,0.3); }
    50% { text-shadow: 0 0 20px rgba(255,215,0,0.7); }
    100% { text-shadow: 0 0 10px rgba(255,215,0,0.3); }
  }

  .video-title {
    animation: gold-glow 3s infinite ease-in-out;
  }
</style>
</head>

<body>

  <header>
    <h1>🎬 الفيديوهات</h1>
    <div id="back">⬅ العودة إلى المحاضرات</div>
  </header>

  <main>
    <div id="videos-container">
      <div style="text-align:center; color:#ffd700;">⏳ جاري تحميل الفيديوهات...</div>
    </div>
  </main>

  <footer>
    © جميع الحقوق محفوظة لمنصة <span>THE BEST</span> 🔥
  </footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get("subject");
const teacher = urlParams.get("teacher");
const chapter = urlParams.get("chapter");
const lecture = urlParams.get("lecture");

const videosContainer = document.getElementById("videos-container");
const backBtn = document.getElementById("back");

backBtn.onclick = () => {
  window.location.href = `lectures.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
};

function normalize(str) {
  return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
}

async function loadVideos() {
  try {
    const res = await fetch("coursatk_scraped_data.json");
    const json = await res.json();
    const data = json.data || json;

    const wantedSubject = normalize(subject);
    const wantedTeacher = normalize(teacher);
    const wantedChapter = normalize(chapter);
    const wantedLecture = normalize(lecture);

    const videos = [];

    (data || []).forEach((year) => {
      (year.subjects || []).forEach((sub) => {
        if (normalize(sub.subject_name).includes(wantedSubject)) {
          (sub.teachers || []).forEach((t) => {
            if (normalize(t.teacher_name).includes(wantedTeacher)) {
              (t.chapters || []).forEach((chap) => {
                if (normalize(chap.chapter_name).includes(wantedChapter)) {
                  (chap.lectures || []).forEach((lec) => {
                    if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                      (lec.videos || []).forEach((vid) => {
                        if (vid.links && vid.links.length > 0) {
                          videos.push({
                            name: vid.video_name,
                            links: vid.links
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        }
      });
    });

    videosContainer.innerHTML = "";

    if (videos.length === 0) {
      videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
      return;
    }

    videos.forEach((video) => {
      const box = document.createElement("div");
      box.className = "video-box";
      box.innerHTML = `
        <div class="video-icon">🎥</div>
        <div class="video-title">${video.name}</div>
      `;
    box.onclick = () => {
  // نبحث عن لينك الجودة 720
  let selected = video.links.find(link => parseInt(link.label) === 720);

  // لو مش موجود 720، نختار أعلى جودة متوفرة
  if (!selected) {
    selected = video.links.reduce((prev, current) => {
      return parseInt(current.label) > parseInt(prev.label) ? current : prev;
    });
  }

  // نحفظ الجودة المختارة فقط
  localStorage.setItem("video_sources", JSON.stringify(selected));
  localStorage.setItem("video_title", video.name);

  // نفتح صفحة المشغل
  window.location.href = "player.html";
};


      videosContainer.appendChild(box);
    });

  } catch (err) {
    console.error(err);
    videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
  }
}

loadVideos();
</script>

</body>
</html>
