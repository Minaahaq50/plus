<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>🎬 الفيديوهات - منصة THE BEST</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #ffd700;
    --gold-light: #ffea8a;
    --bg-dark: #0a0a0a;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --border-gold: rgba(255, 215, 0, 0.25);
    --shadow: 0 0 20px rgba(255, 215, 0, 0.25);
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: radial-gradient(circle at top, #000, #0a0a0a);
    color: #fff;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: rgba(15, 15, 15, 0.9);
    border-bottom: 1px solid var(--border-gold);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.1);
  }

  header h1 {
    color: var(--gold);
    font-size: 2rem;
    font-weight: 900;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
  }

  #back {
    background: linear-gradient(135deg, #ffd700, #ffb400);
    color: #000;
    border: none;
    border-radius: 50px;
    padding: 10px 20px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(255,215,0,0.3);
  }

  #back:hover {
    background: var(--gold-light);
    transform: scale(1.05);
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
  }

  main {
    padding: 50px 20px 80px;
    max-width: 1300px;
    margin: auto;
  }

  #videos-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 30px;
  }

  .video-box {
    background: var(--glass-bg);
    border: 1px solid var(--border-gold);
    border-radius: 20px;
    padding: 30px 25px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 10px rgba(255,215,0,0.1);
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }

  .video-box:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 25px rgba(255,215,0,0.3);
  }

  .video-title {
    color: var(--gold);
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 20px;
    line-height: 1.6;
    text-shadow: 0 0 10px rgba(255,215,0,0.3);
    animation: glow 3s infinite ease-in-out;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 10px rgba(255,215,0,0.3); }
    50% { text-shadow: 0 0 20px rgba(255,215,0,0.7); }
    100% { text-shadow: 0 0 10px rgba(255,215,0,0.3); }
  }

  .watch-btn {
    background: linear-gradient(135deg, var(--gold), #ffb400);
    color: #000;
    border: none;
    border-radius: 30px;
    padding: 12px 25px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 1rem;
    box-shadow: 0 0 10px rgba(255,215,0,0.3);
  }

  .watch-btn:hover {
    background: var(--gold-light);
    transform: scale(1.07);
    box-shadow: 0 0 25px rgba(255,215,0,0.5);
  }

  footer {
    text-align: center;
    color: #999;
    font-size: 0.95rem;
    padding: 25px 10px 20px;
    border-top: 1px solid rgba(255, 215, 0, 0.1);
    background: #0a0a0a;
  }

  footer span {
    color: var(--gold);
    font-weight: bold;
  }

  @media (max-width: 600px) {
    header h1 {
      font-size: 1.5rem;
    }
    .video-title {
      font-size: 18px;
    }
  }
</style>
</head>

<body>

  <header>
    <h1>🎬 الفيديوهات</h1>
    <button id="back">⬅ الرجوع</button>
  </header>

  <main>
    <div id="videos-container">
      <div style="text-align:center; color:#ffd700;">⏳ جاري تحميل الفيديوهات...</div>
    </div>
  </main>

  <footer>
    © جميع الحقوق محفوظة لمنصة <span>THE BEST</span> 🔥
  </footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get("subject");
const teacher = urlParams.get("teacher");
const chapter = urlParams.get("chapter");
const lecture = urlParams.get("lecture");

const videosContainer = document.getElementById("videos-container");
const backBtn = document.getElementById("back");

backBtn.onclick = () => {
  window.location.href = `lecture_name.htmll?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
};

function normalize(str) {
  return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
}

async function loadVideos() {
  try {
    const res = await fetch("coursatk_scraped_data.json");
    const json = await res.json();
    const data = json.data || json;

    const wantedSubject = normalize(subject);
    const wantedTeacher = normalize(teacher);
    const wantedChapter = normalize(chapter);
    const wantedLecture = normalize(lecture);

    const videos = [];

    (data || []).forEach((year) => {
      (year.subjects || []).forEach((sub) => {
        if (normalize(sub.subject_name).includes(wantedSubject)) {
          (sub.teachers || []).forEach((t) => {
            if (normalize(t.teacher_name).includes(wantedTeacher)) {
              (t.chapters || []).forEach((chap) => {
                if (normalize(chap.chapter_name).includes(wantedChapter)) {
                  (chap.lectures || []).forEach((lec) => {
                    if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                      (lec.videos || []).forEach((vid) => {
                        if (vid.links && vid.links.length > 0) {
                          videos.push({
                            name: vid.video_name,
                            links: vid.links
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        }
      });
    });

    videosContainer.innerHTML = "";

    if (videos.length === 0) {
      videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
      return;
    }

    videos.forEach((video) => {
      const box = document.createElement("div");
      box.className = "video-box";
      box.innerHTML = `
        <div class="video-title">${video.name}</div>
        <button class="watch-btn">🎥 اضغط للمشاهدة</button>
      `;

      box.querySelector(".watch-btn").onclick = () => {
        let selected = video.links.find(link => parseInt(link.label) === 720);
        if (!selected) {
          selected = video.links.reduce((prev, current) => {
            return parseInt(current.label) > parseInt(prev.label) ? current : prev;
          });
        }

        localStorage.setItem("video_sources", JSON.stringify(selected));
        localStorage.setItem("video_title", video.name);

        window.location.href = "player.html";
      };

      videosContainer.appendChild(box);
    });

  } catch (err) {
    console.error(err);
    videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
  }
}

loadVideos();
</script>

</body>
</html>
