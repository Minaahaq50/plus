<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الفيديوهات - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0d0d0d;
      color: #fff;
      margin: 0;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: #ffd700;
      font-size: 1.6rem;
      margin: 0;
      font-weight: 900;
      text-align: center;
      flex-grow: 1;
    }

    #back {
      background: rgba(255, 215, 0, 0.1);
      border: 1.5px solid #ffd700;
      color: #ffd700;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.3s;
      margin-left: 5px;
    }

    #back:hover {
      background: rgba(255, 215, 0, 0.2);
      transform: translateY(-1px);
    }

    #videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      max-width: 1100px;
      margin: auto;
    }

    .video-box {
      background: #1a1a1a;
      border: 1px solid rgba(255, 215, 0, 0.15);
      border-radius: 12px;
      padding: 12px;
      transition: 0.3s;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(255,215,0,0.05);
    }

    .video-box:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 18px rgba(255,215,0,0.25);
    }

    .video-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffd700;
      text-align: center;
      margin-bottom: 8px;
    }

    .thumb {
      background: #000;
      border-radius: 10px;
      height: 160px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    .thumb::after {
      content: "▶";
      position: absolute;
      font-size: 40px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      transition: transform 0.3s ease;
    }

    .thumb:hover::after {
      transform: scale(1.1);
    }

    .loading, .error {
      text-align: center;
      color: #ffd700;
      font-size: 17px;
      padding: 20px;
    }

    footer {
      text-align: center;
      color: #888;
      margin-top: 35px;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 215, 0, 0.1);
      padding-top: 15px;
    }

    footer span {
      color: #ffd700;
    }

    /* ⚡ تحسين عرض الموبايل */
    @media (max-width: 600px) {
      header h1 {
        font-size: 1.3rem;
      }
      .video-title {
        font-size: 15px;
      }
      .thumb {
        height: 140px;
      }
      body {
        padding: 10px;
      }
      #videos-container {
        gap: 12px;
      }
      #back {
        padding: 5px 8px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <button id="back">⬅ رجوع</button>
    <h1>🎬 الفيديوهات</h1>
    <div style="width:35px;"></div>
  </header>

  <main>
    <div id="videos-container">
      <div class="loading">⏳....𝑳𝒐𝒂𝒅𝒊𝒏𝒈</div>
    </div>
  </main>

  <footer>
    © جميع الحقوق محفوظة لمنصة <span>THE BEST</span> 🔥
  </footer>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get("subject");
    const teacher = urlParams.get("teacher");
    const chapter = urlParams.get("chapter");
    const lecture = urlParams.get("lecture");

    const videosContainer = document.getElementById("videos-container");
    const backBtn = document.getElementById("back");

    backBtn.onclick = () => {
      window.location.href = `lecture_name.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
    };

    function normalize(str) {
      return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
    }

    async function loadVideos() {
      try {
        const res = await fetch("coursatk_scraped_data.json");
        if (!res.ok) throw new Error("فشل تحميل البيانات");
        const json = await res.json();
        const data = json.data || json;

        const wantedSubject = normalize(subject);
        const wantedTeacher = normalize(teacher);
        const wantedChapter = normalize(chapter);
        const wantedLecture = normalize(lecture);

        const videos = [];

        (data || []).forEach((year) => {
          (year.subjects || []).forEach((sub) => {
            if (normalize(sub.subject_name).includes(wantedSubject)) {
              (sub.teachers || []).forEach((t) => {
                if (normalize(t.teacher_name).includes(wantedTeacher)) {
                  (t.chapters || []).forEach((chap) => {
                    if (normalize(chap.chapter_name).includes(wantedChapter)) {
                      (chap.lectures || []).forEach((lec) => {
                        if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                          (lec.videos || []).forEach((vid) => {
                            if (vid.links && vid.links.length > 0) {
                              videos.push({
                                name: vid.video_name,
                                links: vid.links
                              });
                            }
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        });

        videosContainer.innerHTML = "";

        if (videos.length === 0) {
          videosContainer.innerHTML = "<div class='error'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
          return;
        }

        videos.forEach((video) => {
          const box = document.createElement("div");
          box.className = "video-box";
          box.innerHTML = `
            <div class="video-title">${video.name}</div>
            <div class="thumb"></div>
          `;

          box.querySelector(".thumb").onclick = () => {
            let selected = video.links.find(link => parseInt(link.label) === 720);
            if (!selected) {
              selected = video.links.reduce((prev, current) => {
                return parseInt(current.label) > parseInt(prev.label) ? current : prev;
              });
            }

            localStorage.setItem("video_sources", JSON.stringify(selected));
            localStorage.setItem("video_title", video.name);
            window.location.href = "player.html";
          };

          videosContainer.appendChild(box);
        });

      } catch (err) {
        console.error(err);
        videosContainer.innerHTML = "<div class='error'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
      }
    }

    loadVideos();
  </script>
</body>
</html>
