<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الفيديوهات - منصة THE BEST</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #0d0d0d;
    color: #fff;
    padding: 20px;
    margin: 0;
  }

  h1 {
    color: #ffd700;
    text-align: center;
    font-size: 2rem;
    margin-bottom: 30px;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #ffd700;
  }

  #back {
    color: #ffd700;
    cursor: pointer;
    text-align: center;
    font-weight: bold;
    margin-bottom: 25px;
    display: block;
    transition: 0.3s;
  }
  #back:hover {
    color: #fff;
    transform: translateY(-3px);
  }

  #videos-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .video-box {
    background: linear-gradient(145deg, #1a1a1a, #111);
    border: 1px solid rgba(255, 215, 0, 0.3);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
    cursor: pointer;
  }

  .video-box:hover {
    transform: translateY(-6px);
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
  }

  .video-title {
    color: #ffd700;
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 8px;
  }

  .video-title:hover {
    color: #fff;
  }

  @media (max-width: 768px) {
    .video-title {
      font-size: 16px;
    }
  }
</style>
</head>
<body>

<h1>🎬 Videos</h1>
<div id="back">⬅ العودة إلى المحاضرات</div>

<div id="videos-container">
  <div style="text-align:center; color:#ffd700;">⏳ جاري تحميل الفيديوهات...</div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get("subject");
const teacher = urlParams.get("teacher");
const chapter = urlParams.get("chapter");
const lecture = urlParams.get("lecture");

const videosContainer = document.getElementById("videos-container");
const backBtn = document.getElementById("back");

backBtn.onclick = () => {
  window.location.href = `lectures.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
};

function normalize(str) {
  return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
}

async function loadVideos() {
  try {
    const res = await fetch("coursatk_scraped_data.json");
    const json = await res.json();
    const data = json.data || json;

    const wantedSubject = normalize(subject);
    const wantedTeacher = normalize(teacher);
    const wantedChapter = normalize(chapter);
    const wantedLecture = normalize(lecture);

    const videos = [];

    (data || []).forEach((year) => {
      (year.subjects || []).forEach((sub) => {
        if (normalize(sub.subject_name).includes(wantedSubject)) {
          (sub.teachers || []).forEach((t) => {
            if (normalize(t.teacher_name).includes(wantedTeacher)) {
              (t.chapters || []).forEach((chap) => {
                if (normalize(chap.chapter_name).includes(wantedChapter)) {
                  (chap.lectures || []).forEach((lec) => {
                    if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                      (lec.videos || []).forEach((vid) => {
                        if (vid.links && vid.links.length > 0) {
                          videos.push({
                            name: vid.video_name,
                            links: vid.links
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        }
      });
    });

    videosContainer.innerHTML = "";

    if (videos.length === 0) {
      videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
      return;
    }

    videos.forEach((video) => {
      const box = document.createElement("div");
      box.className = "video-box";
      box.innerHTML = `<div class="video-title">${video.name}</div>`;
      box.onclick = () => {
      const sources = encodeURIComponent(JSON.stringify(video.links));
window.location.href = player.html?sources=${sources}&title=${encodeURIComponent(video.name)};

      };
      videosContainer.appendChild(box);
    });
  } catch (err) {
    console.error(err);
    videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
  }
}

loadVideos();
</script>

</body>
</html>
