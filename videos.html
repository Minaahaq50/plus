<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الفيديوهات - منصة THE BEST</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0d0d0d;
      color: #fff;
      padding: 20px;
      margin: 0;
    }
    h1 {
      color: #ffd700;
      text-align: center;
      margin: 0 0 25px;
    }
    #videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }
    .video-box {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
      text-align: center;
      transition: 0.3s;
    }
    .video-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    }
    .video-title {
      color: #ffd700;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .thumb-wrapper {
      position: relative;
    }
    .video-thumb {
      width: 100%;
      height: 200px;
      border-radius: 10px;
      object-fit: cover;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: 0.3s;
      border-radius: 10px;
    }
    .thumb-wrapper:hover .overlay {
      opacity: 1;
    }
    .overlay i {
      font-size: 50px;
      color: #ffd700;
    }
    .video-meta {
      font-size: 14px;
      color: #bbb;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <h1>🎥 الفيديوهات</h1>
  <div id="videos-container">
    <div style="text-align:center;color:#ffd700;">⏳ جاري تحميل الفيديوهات...</div>
  </div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get("subject");
    const teacher = urlParams.get("teacher");
    const chapter = urlParams.get("chapter");
    const lecture = urlParams.get("lecture");
    const videosContainer = document.getElementById("videos-container");

    // ✅ صور المدرسين
    const teacherThumbs = {
      "أ. رضا الفاروق": "https://www2.0zz0.com/2025/09/30/16/498034522.jpeg",
      "احمد الجوهري": "https://www2.0zz0.com/2025/09/30/16/552561462.jpeg",
      "عبقري لغة": "https://ahmed-tarek.net/static/media/mr-tarek-hero-section.f2bf4f0e2cf0c8b0d728.png",
      "م.شريف المصري": "https://www2.0zz0.com/2025/11/06/07/363623552.jpg",
      "أ.محمد عبد المعبود": "https://abdelmaaboud.com/frontend/landing/images/6T9A1528-1.png",
      "د.عبدالله حبشي": "https://www2.0zz0.com/2025/11/05/22/229876543.jpg"
    };

    // 🔄 توحيد النصوص
    function normalize(str) {
      return (str || "")
        .trim()
        .replace(/[\s.\-ـ_]/g, "")
        .toLowerCase();
    }

    async function loadVideos() {
      try {
        const res = await fetch("coursatk_scraped_data.json");
        const json = await res.json();
        const data = json.data || json;

        const wantedSubject = normalize(subject);
        const wantedTeacher = normalize(teacher);
        const wantedChapter = normalize(chapter);
        const wantedLecture = normalize(lecture);

        const videos = [];

        (data || []).forEach((year) => {
          (year.subjects || []).forEach((sub) => {
            if (normalize(sub.subject_name).includes(wantedSubject)) {
              (sub.teachers || []).forEach((t) => {
                if (normalize(t.teacher_name).includes(wantedTeacher)) {
                  (t.chapters || []).forEach((chap) => {
                    if (normalize(chap.chapter_name).includes(wantedChapter)) {
                      (chap.lectures || []).forEach((lec) => {
                        if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                          (lec.videos || []).forEach((vid) => {
                            if (vid.links && vid.links.length > 0) {
                              const qualities = vid.links.map(q => ({
                                label: q.label,
                                url: q.url
                              }));
                              videos.push({
                                name: vid.video_name,
                                qualities
                              });
                            }
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        });

        videosContainer.innerHTML = "";

        if (videos.length === 0) {
          videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
          return;
        }

        // 🔍 نجيب صورة المدرس حتى لو الاسم مختلف
        const foundTeacher = Object.keys(teacherThumbs).find(k => normalize(k) === normalize(teacher));
        const thumb = foundTeacher ? teacherThumbs[foundTeacher] : "https://img.icons8.com/fluency/300/youtube-play.png";

        videos.forEach((video) => {
          const box = document.createElement("div");
          box.className = "video-box";
          box.innerHTML = `
            <div class="video-title">${video.name}</div>
            <div class="thumb-wrapper">
              <img class="video-thumb" src="${thumb}" alt="video">
              <div class="overlay"><i class="fas fa-play-circle"></i></div>
            </div>
            <div class="video-meta">${teacher} • ${chapter}</div>
          `;
          box.onclick = () => {
            const sources = encodeURIComponent(JSON.stringify(video.qualities));
            window.location.href = \`player.html?sources=\${sources}&title=\${encodeURIComponent(video.name)}\`;
          };
          videosContainer.appendChild(box);
        });

      } catch (err) {
        console.error(err);
        videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>❌ خطأ أثناء تحميل البيانات.</div>";
      }
    }

    loadVideos();
  </script>
</body>
</html>
