<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="منصة THE BEST - عرض الفيديوهات التعليمية حسب المادة والمدرس والفصل." />
  <meta name="keywords" content="فيديوهات تعليمية, مدرسين, مواد, منصة THE BEST" />
  <title>الفيديوهات - منصة THE BEST</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #0d0d0d;
      color: #fff;
      padding: 20px;
      margin: 0;
      line-height: 1.6;
    }

    h1 {
      color: #ffd700;
      text-align: center;
      font-size: 2rem;
      margin: 0;
    }

    /* رأس الصفحة */
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    /* زر الرجوع الوحيد */
    #back-arrow {
      background: rgba(255, 215, 0, 0.1);
      border: 2px solid #ffd700;
      color: #ffd700;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.2);
    }
    #back-arrow:hover {
      background: rgba(255, 215, 0, 0.2);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }

    /* تنسيق الفيديوهات */
    #videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .video-box {
      background: #1a1a1a;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.1);
      transition: transform 0.3s ease-in-out, box-shadow 0.3s;
      overflow: hidden;
    }

    .video-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
    }

    .video-title {
      margin: 10px 0 6px 0;
      font-size: 18px;
      color: #ffd700;
      text-align: center;
      font-weight: 700;
    }

    .video-teacher {
      text-align: center;
      font-size: 14px;
      margin-bottom: 10px;
      color: #bbb;
    }

    .thumb {
      position: relative;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.3s;
    }

    .thumb:hover {
      opacity: 0.9;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 50px;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      transition: transform 0.3s;
    }

    .thumb:hover .play-btn {
      transform: translate(-50%, -50%) scale(1.1);
    }

    .loading, .error {
      text-align: center;
      font-size: 18px;
      color: #ffd700;
      padding: 20px;
    }

    @media (max-width: 768px) {
      #videos-container {
        grid-template-columns: 1fr;
      }
      .video-title {
        font-size: 16px;
      }
      .thumb {
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <button id="back-arrow" title="رجوع">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1>𝑽𝒊𝒅𝒆𝒐𝒔</h1>
    <div style="width:42px;"></div> <!-- لتوازن التصميم -->
  </div>

  <div id="videos-container">
    <div class="loading">⏳....𝑳𝒐𝒂𝒅𝒊𝒏𝒈</div>
  </div>

<script type="module">
const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get("subject");
const teacher = urlParams.get("teacher");
const chapter = urlParams.get("chapter");
const lecture = urlParams.get("lecture");

const videosContainer = document.getElementById("videos-container");
const backBtn = document.getElementById("back");

backBtn.onclick = () => {
  if (lecture) {
    window.location.href = `lectures.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
  } else {
    window.location.href = `chapters.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}`;
  }
};

// توحيد النصوص
function normalize(str) {
  return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
}

async function loadVideos() {
  if (!subject || !teacher || !chapter) {
    videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لم يتم تحديد المادة أو المدرس أو الباب.</div>";
    return;
  }

  const res = await fetch("coursatk_scraped_data.json");
  const json = await res.json();
  const data = json.data || json;

  const wantedSubject = normalize(subject);
  const wantedTeacher = normalize(teacher);
  const wantedChapter = normalize(chapter);
  const wantedLecture = normalize(lecture);
  const videos = [];

  (data || []).forEach((year) => {
    (year.subjects || []).forEach((sub) => {
      if (normalize(sub.subject_name).includes(wantedSubject)) {
        (sub.teachers || []).forEach((t) => {
          if (normalize(t.teacher_name).includes(wantedTeacher)) {
            (t.chapters || []).forEach((chap) => {
              if (normalize(chap.chapter_name).includes(wantedChapter)) {
                (chap.lectures || []).forEach((lec) => {
                  if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                    (lec.videos || []).forEach((vid) => {
                      const link = vid.links?.[vid.links.length - 1]?.url;
                      if (link) {
                        videos.push({
                          name: vid.video_name,
                          link
                        });
                      }
                    });
                  }
                });
              }
            });
          }
        });
      }
    });
  });

  videosContainer.innerHTML = "";

  if (videos.length === 0) {
    videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
    return;
  }

  videos.forEach((video) => {
    const box = document.createElement("div");
    box.className = "video-box";
    box.innerHTML = `
      <img class="video-thumb" src="https://img.icons8.com/fluency/300/video.png" alt="video">
      <div class="video-title">${video.name}</div>
    `;
    box.onclick = () => {
      window.location.href = `player.html?url=${encodeURIComponent(video.link)}&title=${encodeURIComponent(video.name)}`;
    };
    videosContainer.appendChild(box);
  });
}

loadVideos();
</script>
</body>
</html>
