<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="THE BEST Platform - Browse educational videos by subject, teacher, and chapter." />
  <title>Videos - THE BEST Platform</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #0e0e0e;
      color: #fff;
      margin: 0;
      padding: 30px;
      line-height: 1.6;
    }

    h1 {
      color: #ffcc00;
      text-align: center;
      font-size: 2rem;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      max-width: 1200px;
      margin-inline: auto;
    }

    #back-arrow {
      background: rgba(255, 204, 0, 0.1);
      border: 2px solid #ffcc00;
      color: #ffcc00;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: 0.3s;
    }

    #back-arrow:hover {
      background: rgba(255, 204, 0, 0.25);
      transform: translateY(-2px);
    }

    #videos-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .video-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      border: 1px solid rgba(255, 204, 0, 0.15);
      box-shadow: 0 0 10px rgba(255, 204, 0, 0.08);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .video-card:hover {
      background: #222;
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }

    .video-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffcc00;
      margin-bottom: 8px;
      transition: 0.3s;
    }

    .video-meta {
      font-size: 0.9rem;
      color: #aaa;
    }

    .loading {
      text-align: center;
      font-size: 18px;
      color: #ffcc00;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .video-title {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="header-container">
    <button id="back-arrow" title="Back">
      <i class="fas fa-arrow-left"></i>
    </button>
    <h1>🎥 Video Library</h1>
    <div style="width:42px;"></div>
  </div>

  <div id="videos-container">
    <div class="loading">⏳ Loading videos...</div>
  </div>

  <script type="module">
    const urlParams = new URLSearchParams(window.location.search);
    const subject = urlParams.get("subject");
    const teacher = urlParams.get("teacher");
    const chapter = urlParams.get("chapter");
    const lecture = urlParams.get("lecture");

    const videosContainer = document.getElementById("videos-container");
    const backBtn = document.getElementById("back-arrow");

    backBtn.onclick = () => {
      if (lecture) {
        window.location.href = `lectures.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
      } else {
        window.location.href = `chapters.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}`;
      }
    };

    function normalize(str) {
      return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
    }

    async function loadVideos() {
      try {
        const res = await fetch("coursatk_scraped_data.json");
        const json = await res.json();
        const data = json.data || json;

        const wantedSubject = normalize(subject);
        const wantedTeacher = normalize(teacher);
        const wantedChapter = normalize(chapter);
        const wantedLecture = normalize(lecture);
        const videos = [];

        (data || []).forEach((year) => {
          (year.subjects || []).forEach((sub) => {
            if (normalize(sub.subject_name).includes(wantedSubject)) {
              (sub.teachers || []).forEach((t) => {
                if (normalize(t.teacher_name).includes(wantedTeacher)) {
                  (t.chapters || []).forEach((chap) => {
                    if (normalize(chap.chapter_name).includes(wantedChapter)) {
                      (chap.lectures || []).forEach((lec) => {
                        if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                          (lec.videos || []).forEach((vid) => {
                            const link = vid.links?.[vid.links.length - 1]?.url;
                            if (link) {
                              videos.push({
                                name: vid.video_name,
                                link
                              });
                            }
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        });

        videosContainer.innerHTML = "";

        if (videos.length === 0) {
          videosContainer.innerHTML = "<div class='loading'>⚠️ No videos found for this lecture.</div>";
          return;
        }

        videos.forEach((video) => {
          const card = document.createElement("div");
          card.className = "video-card";
          card.innerHTML = `
            <div class="video-title">${video.name}</div>
            <div class="video-meta">${teacher || "Unknown Teacher"} • ${chapter || ""}</div>
          `;
          card.onclick = () => {
            window.location.href = `player.html?url=${encodeURIComponent(video.link)}&title=${encodeURIComponent(video.name)}`;
          };
          videosContainer.appendChild(card);
        });

      } catch (err) {
        console.error("❌ Error loading data:", err);
        videosContainer.innerHTML = "<div class='loading'>❌ Error loading videos.</div>";
      }
    }

    loadVideos();
  </script>

</body>
</html>
