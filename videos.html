<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎬 منصة THE BEST - الفيديوهات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --gold: #ffd700;
    --gold-light: #fff3b0;
    --bg-dark: #06060a;
    --glass: rgba(255,255,255,0.06);
    --accent: #ffb400;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: radial-gradient(circle at 20% 20%, #0b0b17, #000);
    color: #fff;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    min-height: 100vh;
  }

  header {
    background: rgba(15,15,15,0.8);
    backdrop-filter: blur(12px);
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 25px;
    border-bottom: 1px solid rgba(255, 215, 0, 0.25);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 {
    font-size: 1.9rem;
    font-weight: 900;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(255,215,0,0.4);
  }

  #back {
    background: linear-gradient(135deg, var(--gold), var(--accent));
    border: none;
    border-radius: 50px;
    padding: 10px 22px;
    font-weight: bold;
    color: #000;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 15px rgba(255,215,0,0.3);
  }

  #back:hover {
    transform: scale(1.08);
    background: var(--gold-light);
  }

  main {
    padding: 60px 20px 100px;
    max-width: 1300px;
    margin: auto;
  }

  #videos-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 35px;
  }

  .video-box {
    position: relative;
    background: var(--glass);
    border: 1px solid rgba(255,215,0,0.2);
    border-radius: 18px;
    padding: 30px 25px;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    backdrop-filter: blur(10px);
    overflow: hidden;
    box-shadow: 0 0 15px rgba(255,215,0,0.05);
  }

  .video-box::before {
    content: "";
    position: absolute;
    top: -100%;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,215,0,0.15), transparent);
    transition: top 0.6s ease;
  }

  .video-box:hover::before {
    top: 100%;
  }

  .video-box:hover {
    transform: translateY(-8px);
    box-shadow: 0 0 25px rgba(255,215,0,0.3);
  }

  .video-title {
    font-size: 1.3rem;
    color: var(--gold);
    font-weight: 800;
    margin-bottom: 25px;
    text-shadow: 0 0 10px rgba(255,215,0,0.4);
  }

  .watch-btn {
    background: linear-gradient(135deg, var(--gold), var(--accent));
    border: none;
    border-radius: 30px;
    padding: 12px 28px;
    color: #000;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
    font-size: 1rem;
    box-shadow: 0 0 20px rgba(255,215,0,0.25);
  }

  .watch-btn:hover {
    background: var(--gold-light);
    transform: scale(1.07);
    box-shadow: 0 0 35px rgba(255,215,0,0.5);
  }

  footer {
    text-align: center;
    padding: 30px 10px;
    font-size: 0.95rem;
    color: #999;
    background: #0a0a0a;
    border-top: 1px solid rgba(255,215,0,0.15);
  }

  footer span {
    color: var(--gold);
    font-weight: bold;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 1.5rem; }
    .video-title { font-size: 1.1rem; }
  }
</style>
</head>

<body>
  <header>
    <h1>🎬 الفيديوهات</h1>
    <button id="back">⬅ رجوع</button>
  </header>

  <main>
    <div id="videos-container">
      <div style="text-align:center;color:#ffd700;">⏳ جاري تحميل الفيديوهات...</div>
    </div>
  </main>

  <footer>
    © جميع الحقوق محفوظة لمنصة <span>THE BEST</span> 2026 ✨
  </footer>

<script>
const urlParams = new URLSearchParams(window.location.search);
const subject = urlParams.get("subject");
const teacher = urlParams.get("teacher");
const chapter = urlParams.get("chapter");
const lecture = urlParams.get("lecture");

const videosContainer = document.getElementById("videos-container");
const backBtn = document.getElementById("back");

backBtn.onclick = () => {
  window.location.href = `lecture_name.html?subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(teacher)}&chapter=${encodeURIComponent(chapter)}`;
};

function normalize(str) {
  return (str || "").trim().replace(/[\s.\-ـ_]/g, "").toLowerCase();
}

async function loadVideos() {
  try {
    const res = await fetch("coursatk_scraped_data.json");
    const json = await res.json();
    const data = json.data || json;

    const wantedSubject = normalize(subject);
    const wantedTeacher = normalize(teacher);
    const wantedChapter = normalize(chapter);
    const wantedLecture = normalize(lecture);

    const videos = [];

    (data || []).forEach((year) => {
      (year.subjects || []).forEach((sub) => {
        if (normalize(sub.subject_name).includes(wantedSubject)) {
          (sub.teachers || []).forEach((t) => {
            if (normalize(t.teacher_name).includes(wantedTeacher)) {
              (t.chapters || []).forEach((chap) => {
                if (normalize(chap.chapter_name).includes(wantedChapter)) {
                  (chap.lectures || []).forEach((lec) => {
                    if (!lecture || normalize(lec.lecture_name).includes(wantedLecture)) {
                      (lec.videos || []).forEach((vid) => {
                        if (vid.links && vid.links.length > 0) {
                          videos.push({
                            name: vid.video_name,
                            links: vid.links
                          });
                        }
                      });
                    }
                  });
                }
              });
            }
          });
        }
      });
    });

    videosContainer.innerHTML = "";

    if (videos.length === 0) {
      videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>⚠️ لا توجد فيديوهات في هذه المحاضرة.</div>";
      return;
    }

    videos.forEach((video) => {
      const box = document.createElement("div");
      box.className = "video-box";
      box.innerHTML = `
        <div class="video-title">${video.name}</div>
        <button class="watch-btn">🎥 مشاهدة</button>
      `;

      box.querySelector(".watch-btn").onclick = () => {
        let selected = video.links.find(link => parseInt(link.label) === 720);
        if (!selected) {
          selected = video.links.reduce((prev, current) =>
            parseInt(current.label) > parseInt(prev.label) ? current : prev
          );
        }

        localStorage.setItem("video_sources", JSON.stringify(selected));
        localStorage.setItem("video_title", video.name);
        window.location.href = "player.html";
      };

      videosContainer.appendChild(box);
    });

  } catch (err) {
    console.error(err);
    videosContainer.innerHTML = "<div style='text-align:center; color:#ffd700;'>❌ حدث خطأ أثناء تحميل البيانات.</div>";
  }
}

loadVideos();
</script>
</body>
</html>
