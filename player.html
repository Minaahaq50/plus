<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>مشغل الفيديو - THE BEST</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
body {
  background: #000;
  color: #fff;
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

video {
  width: 90%;
  max-width: 800px;
  border: 2px solid #ffd700;
  border-radius: 12px;
  margin-bottom: 20px;
}

select {
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #ffd700;
  color: #000;
  font-weight: bold;
  cursor: pointer;
}

h1 {
  text-align: center;
  color: #ffd700;
  font-size: 1.4rem;
  margin-bottom: 15px;
}
</style>
</head>
<body>

<h1 id="video-title">🎬 جاري التحميل...</h1>
<video id="video-player" controls></video>

<select id="quality-select"></select>

<script>
try {
  const urlParams = new URLSearchParams(window.location.search);
  const title = urlParams.get("title") || "فيديو بدون اسم";
  const sources = JSON.parse(decodeURIComponent(urlParams.get("sources")));

  document.getElementById("video-title").innerText = title;

  const video = document.getElementById("video-player");
  const select = document.getElementById("quality-select");

  // إنشاء قائمة الجودات
  sources.forEach((src) => {
    const option = document.createElement("option");
    option.value = src.url;
    option.text = `${src.label}p`; // ✅ تم إصلاح الخطأ هنا
    select.appendChild(option);
  });

  // تشغيل أعلى جودة افتراضيًا
  video.src = select.value = sources[sources.length - 1].url;

  select.onchange = () => {
    video.src = select.value;
    video.play();
  };
} catch (err) {
  console.error("❌ خطأ في تحميل الفيديو:", err);
  alert("حدث خطأ أثناء تحميل الفيديو. تأكد من صحة البيانات في الرابط.");
}
</script>

</body>
</html>
