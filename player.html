<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تشغيل الفيديو - منصة THE BEST</title>
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #000;
      color: #fff;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      background: #111;
      box-shadow: 0 0 10px rgba(255,215,0,0.1);
    }
    .topbar span {
      color: #ffd700;
      font-weight: bold;
      font-size: 18px;
    }
    .back {
      color: #ffd700;
      cursor: pointer;
      font-size: 22px;
    }
    video {
      width: 100%;
      max-width: 960px;
      border-radius: 12px;
      margin: 30px auto;
      display: block;
      box-shadow: 0 0 20px rgba(255,215,0,0.2);
      background: #000;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="back" onclick="history.back()">⬅</div>
    <span>🎬 مشغل الفيديو</span>
    <div style="width:30px;"></div>
  </div>

  <video id="player" playsinline controls></video>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const title = params.get('title') || 'الفيديو';
    const sourcesParam = params.get('sources'); // هنا بنستقبل كل الجودات

    let sources = [];

    try {
      if (sourcesParam) {
        sources = JSON.parse(decodeURIComponent(sourcesParam));
      }
    } catch (err) {
      console.error('خطأ في قراءة الجودات:', err);
    }

    if (sources.length === 0) {
      document.body.innerHTML = "<p style='color:#ffd700; margin-top:50px;'>⚠️ لا توجد روابط فيديو صالحة.</p>";
    } else {
      const player = new Plyr('#player', {
        controls: [
          'play-large','play','progress','current-time',
          'mute','volume','settings','pip','airplay','fullscreen'
        ],
        settings: ['quality', 'speed', 'loop'],
        quality: {
          default: sources[sources.length - 1].label,
          options: sources.map(s => s.label),
          forced: true,
          onChange: (q) => {
            const selected = sources.find(s => s.label === q);
            if (selected) {
              player.source = {
                type: 'video',
                sources: [{ src: selected.url, type: 'video/mp4', size: q }]
              };
              player.play();
            }
          }
        }
      });

      // إعداد أول فيديو
      player.source = {
        type: 'video',
        title,
        sources: sources.map(s => ({
          src: s.url,
          type: 'video/mp4',
          size: s.label
        }))
      };
    }
  </script>
</body>
</html>
